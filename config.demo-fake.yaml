# Same 2 rooms as config.demo.yaml, but engine_mode: fake (FakeEngine
# replays a recorded session): `make demo-fake` runs this for free, e.g. to
# try Glosa without a Gemini key or to smoke-test Docker. Also has a 3rd
# room, source_type "emitter" (Task 14a), for trying/verifying the room
# station without a Gemini key either: open /station/station-demo?key=...
# (glosa.web.station.station_url) with a real or fake microphone.
#
# Limitation: each engine replays ONE recording, whatever the talk's
# language or audio: the fast engine an English Live Translate session
# (samples/fixtures/lt_en.jsonl, or fake_fixture), the glossary engine a
# Spanish transcribe-live session (samples/fixtures/tr_es.jsonl). Spanish
# rooms get the glossary engine by default, English ones the fast engine,
# so this file matches; a talk in another language logs a warning. The
# demo-es room's English track shows FakeTranslator's real recorded
# translations of that Spanish recording (samples/fixtures/tr_es_en.json,
# built by scripts/build_demo_translations.py -- see samples/README.md);
# any segment not in that recording (e.g. a different talk's Spanish audio)
# falls back to FakeTranslator's placeholder ("[en] <source text>").
#
# demo-en and demo-es have `loop: true`: their free session replays the clip
# forever (a fresh fake engine session each time, in step with the audio),
# so whoever opens the demo late still finds live captions. Only here: the
# same in config.demo.yaml would spend real API money all day.

event_name: Glosa demo
timezone: UTC

branding:
  logo_url: /static/branding/nerdearla/nerdearla-logo.svg
  primary: "#FFBA00"
  accent: "#00ACA8"

rooms:
  - id: demo-en
    name: "Demo: English to Spanish"
    source_type: file
    source_url: samples/en_clip.opus
    language: en
    default_targets: [es]
    loop: true  # the free session plays the clip again and again (never in config.demo.yaml)
  - id: demo-es
    name: "Demo: Spanish to English"
    source_type: file
    source_url: samples/es_clip.opus
    language: es
    default_targets: [en]
    loop: true
  - id: station-demo
    name: "Demo: room station"
    source_type: emitter
    # For "emitter", source_url isn't a URL -- the audio comes from a
    # connected station (glosa/web/station.py), not from ffmpeg. Any
    # non-empty placeholder works; the room's own id is a reasonable one.
    source_url: station-demo
    language: en
    default_targets: [es]

engine_mode: fake
db_path: data/demo-fake.db
