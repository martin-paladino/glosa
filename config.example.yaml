# Glosa event configuration. Copy to config.yaml and edit.
# All keys are optional; anything you omit falls back to the defaults
# documented in glosa/config.py (Settings). Secrets (API keys, admin
# password) do NOT go here — they live in .env (see .env.example).

event_name: Nerdearla Vibeathon 2026
timezone: America/Argentina/Buenos_Aires

branding:
  # The bundled Nerdearla logo (glosa/web/static/branding/nerdearla/NOTICE.md);
  # replace with your own event's logo_url and official colors, or leave
  # logo_url blank to show the event name as plain text instead.
  logo_url: /static/branding/nerdearla/nerdearla-logo.svg
  primary: "#FFBA00"
  accent: "#00ACA8"

# "all": anyone with the room link can watch. "qr_only": only via the room QR.
audience_mode: all

# Each room with a source opens a "free session" at startup: the audio is
# captioned in `language` (default en) and translated to the first of
# `default_targets` that differs from it.
# An agenda import maps a talk to a room by the room's id, its name, or any
# of its `agenda_names` (e.g. the room slug Nerdearla's sessions API uses).
rooms:
  - id: main
    name: Main Stage
    agenda_names: [gran-sala]
    source_type: youtube
    source_url: "https://www.youtube.com/watch?v=REPLACE_ME"
    language: es
    default_targets: [en]
  - id: track-2
    name: Track 2
    source_type: file
    source_url: "samples/en_clip.opus"
    language: en
    default_targets: [es]
  # A room station (Task 14a): a mini PC opens /station/<id>?key=<station_key>
  # (glosa.web.station.station_url), captures the audio desk's feed in the
  # browser and streams it to Glosa over a WebSocket -- see the README's
  # "Room stations (mini PC per stage)" section. source_url isn't a URL for
  # this source_type; any non-empty placeholder works.
  # - id: main-station
  #   name: Main Stage (station)
  #   source_type: emitter
  #   source_url: main-station
  #   language: es
  #   default_targets: [en]

# "live": Gemini Live Translate (needs GEMINI_API_KEY). "fake": replays a
# recorded session (fake_fixture, default samples/fixtures/lt_en.jsonl) so a
# demo or a load test costs nothing.
engine_mode: live
# fake_fixture: samples/fixtures/lt_en.jsonl

# Engine for an imported English talk whose agenda row leaves it blank
# ("fast": Live Translate; Spanish talks default to "glossary").
default_engine_en: fast

# SQLite database (agenda, captions, events, costs).
db_path: data/glosa.db

budget_usd: 10.0
exports_public: true

# Gemini API list prices (USD), used for live cost tracking.
prices:
  lt_per_min: 0.0368
  transcribe_per_min: 0.009
  flash_lite_in_per_m: 0.30
  flash_lite_out_per_m: 2.50

# Live Translate session handoff (session lifetime is ~10 min).
relay:
  standby_at: 510 # open the next session in standby at 8.5 min
  force_at: 570 # force the handoff at 9.5 min even without a VAD pause
  stall_timeout: 8.0 # watchdog: reconnect if a session stalls this long

# Server-side energy VAD with an adaptive noise floor.
vad:
  pause_ms: 400
  min_speech_s: 1.5

# P1 segmentation heuristic for on-screen captions.
segmenter:
  comma_min_words: 5
  max_words: 14
  max_wait_s: 3.0

# Shift applied to Live Translate timestamps when generating exports, in
# seconds (measured p50 translation delay; see samples/fixtures/lt_en.jsonl).
default_export_shift_s: 2.4

# Stop sending audio to the engine after this many seconds with no speech
# (per-room VAD); the last 1 s is kept and sent first when voice returns, so
# nothing is lost. 0 disables the gate.
silence_gate_s: 20.0
