<!doctype html>
<html lang="{{ ui }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Glosa{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230D1115'/%3E%3Crect x='4' y='8' width='24' height='16' fill='%23fff'/%3E%3Cpath d='M8 13h16v2.5H8zM8 17.5h10V20H8z' fill='%230D1115'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&amp;family=B612:wght@400;700&amp;family=Martian+Mono:wdth,wght@75,400&amp;display=swap">
  <link rel="stylesheet" href="/static/css/glosa.css">
  {%- block styles %}{% endblock %}
  {%- if brand_css %}
  <style>:root { {% for name, value in brand_css %}{{ name }}: {{ value }}; {% endfor %}}</style>
  {%- endif %}
  {#- Theme and text size before first paint, so the page never flashes. #}
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem("glosa.theme");
        var scale = parseFloat(localStorage.getItem("glosa.scale"));
        if (theme === "light" || theme === "dark" || theme === "contrast") root.dataset.theme = theme;
        if (scale >= 0.8 && scale <= 1.75) root.style.setProperty("--caption-scale", String(scale));
      } catch (e) {}
    })();
  </script>
  {%- block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
