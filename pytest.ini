[pytest]
markers =
    live: tests that call real external APIs (billed); excluded by default.
addopts = -m "not live"
pythonpath = .
asyncio_mode = auto
# Task 15c: restrict collection to tests/ -- without this, pytest's default
# discovery also walks bench/ (any *_test.py there, e.g. bench/load_test.py,
# a manual script run via `make load`, never meant for pytest) and, with no
# __init__.py in bench/, ends up inserting the bare bench/ directory onto
# sys.path to import it; since bench/bench.py sits right there, a later
# `import bench` (from tests/bench/test_bench.py) then resolves the
# top-level "bench" name to that single script file instead of the bench/
# package, breaking `from bench.<module> import ...` everywhere.
testpaths = tests
